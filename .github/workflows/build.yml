name: Wolverine Windows

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolverine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Validate release record
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag=$env:RELEASE_TAG
          if($tag -notmatch '^v[0-9][0-9A-Za-z.+-]*$'){throw 'Invalid release tag'}
          $record=Get-Content ".github/release-validation/$tag.json" -Raw | ConvertFrom-Json
          if($record.tag -ne $tag -or $record.validated_commit -notmatch '^[0-9a-f]{40}$'){throw 'Invalid validation record'}
          if(!$record.native_tests_passed -or $record.movement_seconds -lt 60 -or !$record.normal_exit){throw 'Validation incomplete'}
          git diff --quiet $record.validated_commit HEAD -- src CMakeLists.txt 3rdparty .gitmodules tools/wolverine/Start-Wolverine.ps1 'tools/wolverine/Play Wolverine.bat'
          if($LASTEXITCODE){throw 'Published code differs from validated code'}
          if(!$tag.Contains('-') -and !$record.stable_validation){throw 'Stable release requires broader validation'}
          if(!(Test-Path ".github/release-validation/$tag.md")){throw 'Release notes missing'}
      - name: Locate glslang dependency cache
        id: vcpkg
        shell: pwsh
        run: |
          $root=Split-Path (Get-Command vcpkg).Source
          $hash=(Get-FileHash "$root/ports/glslang/vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "key=glslang-${{ runner.os }}-x64-$hash-tools-opt" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/cache@v4
        id: glslang_cache
        with:
          path: ${{ steps.vcpkg.outputs.root }}/installed/x64-windows
          key: ${{ steps.vcpkg.outputs.key }}
      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot="${{ steps.vcpkg.outputs.root }}"
          if("${{ steps.glslang_cache.outputs.cache-hit }}" -ne 'true') {
            vcpkg install glslang[tools,opt]:x64-windows
            if($LASTEXITCODE){throw 'glslang installation failed'}
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure
        shell: pwsh
        env:
          BUILD_REPO: ${{ github.repository }}
        run: |
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DKYTY_BUILD_LAUNCHER=OFF -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DKYTY_BUILD_ORIGIN=Fork "-DKYTY_BUILD_REPOSITORY=$env:BUILD_REPO"
          if($LASTEXITCODE){throw 'Configure failed'}
      - name: Build
        shell: pwsh
        run: |
          cmake --build _Build/windows --target kyty_emulator memory_tracker_tests resource_tracking_tests resource_materialization_tests srt_native_tests program_disk_cache_tests --parallel 2
          if($LASTEXITCODE){throw 'Build failed'}
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir _Build/windows --output-on-failure -R '^(memory_tracker|resource_tracking|resource_materialization|srt_native|program_disk_cache)$'
          if($LASTEXITCODE){throw 'Tests failed'}
          & _Build/windows/kyty_emulator.exe --help | Out-Null
          if($LASTEXITCODE){throw 'Emulator startup check failed'}
      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          $version=if($env:IS_TAG -eq 'true'){$env:RELEASE_TAG}else{'v0.0.0-ci.'+$env:GITHUB_SHA.Substring(0,7)}
          ./tools/wolverine/Package-Release.ps1 -BuildDirectory _Build/windows -OutputDirectory dist -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: Wolverine-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Wolverine-Windows-x64
          path: dist
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its published assets.'
            exit 0
          fi
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "Wolverine $RELEASE_TAG" \
            --notes-file ".github/release-validation/$RELEASE_TAG.md" "${extra[@]}"
